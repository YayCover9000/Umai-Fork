services:
  setup:
    build: ./setup
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SETUP_PORT:-8080}:8080"
    volumes:
      - umai-data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8787}:8787"
    volumes:
      - umai-data:/data
    environment:
      VIEWER_BASE_URL: ${VIEWER_BASE_URL:-https://umai.noeldemartin.com}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_IMPORT_API_URL: ${VITE_IMPORT_API_URL:-http://localhost:8787}
        VITE_SOLID_DEFAULT_ISSUER: ${VITE_SOLID_DEFAULT_ISSUER:-https://solidcommunity.net}
        VITE_SOLID_DEFAULT_WEB_ID: ${VITE_SOLID_DEFAULT_WEB_ID:-https://umairecepie.solidcommunity.net/profile/card#me}
        VITE_SOLID_DEFAULT_POD_URL: ${VITE_SOLID_DEFAULT_POD_URL:-https://umairecepie.solidcommunity.net/}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  umai-data:
